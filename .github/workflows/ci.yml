name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # `dotnet test` publishes with NativeAOT, which needs a native toolchain.
      - name: Install the native toolchain
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Test
        run: dotnet test Harness.slnx --configuration Release

      - name: Publish
        run: dotnet publish src/Harness/Host/Harness.Host.csproj -c Release -r linux-x64 -o out

      # The harness verifies its own repository with the binary this run produced.
      - name: Prepare the clone
        run: ./out/harness setup

      - name: Check
        run: ./out/harness check --verbose

      - name: Check the commit messages of this pull request
        if: github.event_name == 'pull_request'
        run: ./out/harness commits check "origin/${{ github.base_ref }}..HEAD"
