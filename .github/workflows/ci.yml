name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # `dotnet test` publishes with NativeAOT, which needs a native toolchain.
      - name: Install the native toolchain
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Test
        run: dotnet test Harness.slnx --configuration Release

      - name: Publish
        run: dotnet publish src/Harness/Host/Harness.Host.csproj -c Release -r linux-x64 -o out

      # The managed hook resolves the harness the same way in every clone: the clone-local
      # binary first, then PATH. Installing the run's own build there keeps the check honest.
      - name: Install the harness into the clone
        run: |
          mkdir -p .git/harness/bin
          cp out/harness .git/harness/bin/harness

      - name: Prepare the clone
        run: ./out/harness setup

      - name: Check
        run: ./out/harness check --verbose

      - name: Check the commit messages of this pull request
        if: github.event_name == 'pull_request'
        run: ./out/harness commits check "origin/${{ github.base_ref }}..HEAD"
